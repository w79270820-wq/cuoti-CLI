<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题本 — 行测备考</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F7F4; --sur:#FFFFFF; --sur2:#F2F0EC;
  --bd:#E4E1D8; --bd2:#CCC9C0;
  --t1:#1A1917; --t2:#6B6860; --t3:#A8A49E;
  --amber:#B8720F; --amb-s:#FBF0DC; --amb-t:#E8A020;
  --red:#B83030; --red-s:#FAEAEA;
  --green:#2A5C0A; --grn-s:#EBF5DA;
  --blue:#0B4280; --blu-s:#E3EFFC;
  --teal:#07503F; --tel-s:#DCF2EC;
  --r:8px; --rl:12px;
}
html,body{background:var(--bg);color:var(--t1);height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Titlebar */
#titlebar{height:36px;min-height:36px;display:flex;align-items:center;padding:0 14px;background:var(--sur);border-bottom:0.5px solid var(--bd);-webkit-app-region:drag;user-select:none;gap:8px;flex-shrink:0}
#titlebar .logo{font-size:14px;font-weight:600;color:var(--amber)}
#titlebar .sub{font-size:11px;color:var(--t3)}

/* Layout */
#layout{display:flex;flex:1;overflow:hidden}

/* Sidebar */
#sidebar{width:172px;min-width:172px;background:var(--sur);border-right:0.5px solid var(--bd);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r);font-size:13px;color:var(--t2);border:none;background:none;text-align:left;width:100%;cursor:pointer;transition:background .12s,color .12s;position:relative}
.nav-btn:hover{background:var(--bg);color:var(--t1)}
.nav-btn.active{background:var(--amb-s);color:var(--amber);font-weight:500}
.nav-icon{width:18px;text-align:center;font-size:13px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center;line-height:1.6}
.sidebar-space{flex:1}
.sidebar-ver{font-size:11px;color:var(--t3);padding:6px 10px}

/* Main */
#main{flex:1;overflow-y:auto;padding:22px 24px;min-width:0}
.page-title{font-size:17px;font-weight:600;margin-bottom:18px;color:var(--t1)}

/* Metric row */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.metric{background:var(--sur);border:0.5px solid var(--bd);border-radius:var(--rl);padding:13px 14px}
.metric-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.metric-val{font-size:26px;font-weight:700;line-height:1}

/* Alert */
.alert{font-size:12px;padding:7px 12px;border-radius:var(--r);margin-bottom:14px}
.alert-warn{background:var(--red-s);color:var(--red)}
.alert-ok{background:var(--grn-s);color:var(--green)}

/* Cards */
.card{background:var(--sur);border:0.5px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:8px}
.card-body{padding:13px 15px}
.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.q-content{font-size:13px;line-height:1.75;background:var(--bg);padding:10px 12px;border-radius:var(--r);white-space:pre-wrap;color:var(--t1)}
.q-analysis{font-size:13px;color:#7A4A00;background:var(--amb-s);padding:8px 11px;border-radius:var(--r);margin-top:8px;line-height:1.6}
.card-footer{padding:9px 15px;border-top:0.5px solid var(--bd);display:flex;align-items:center;justify-content:flex-end;gap:8px}

/* Tags */
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:500;white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);font-family:inherit;font-size:12px;cursor:pointer;padding:5px 13px;border:0.5px solid;transition:opacity .15s}
.btn:hover{opacity:.82}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--amber);color:#fff;border-color:var(--amber);font-size:13px;padding:7px 20px}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--bd2)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red-s)}
.btn-answer{background:var(--amber);color:#fff;border-color:var(--amber);font-size:12px}

/* Rating buttons */
.ratings{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.rating-btn{background:transparent;border-radius:var(--r);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 11px;transition:opacity .12s;border:0.5px solid}
.rating-btn:hover{opacity:.78}

/* Answer bar */
.ans-bar{display:flex;gap:14px;padding:7px 11px;background:var(--grn-s);border-radius:var(--r);margin-top:8px;font-size:13px}
.ans-wrong{color:var(--red)} .ans-right{color:var(--green);font-weight:500}

/* Done state */
.review-done{display:flex;align-items:center;gap:9px;font-size:13px}
.done-check{font-size:15px;color:var(--green)}

/* Filters */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:3px 11px;font-size:12px;border-radius:99px;border:0.5px solid var(--bd2);background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;font-family:inherit}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.chip.on{font-weight:500}

/* Search */
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.search-row input{flex:1;max-width:360px}
.search-count{font-size:12px;color:var(--t3);white-space:nowrap}

/* Input / form */
input,select,textarea{width:100%;background:var(--sur);border:0.5px solid var(--bd2);border-radius:var(--r);padding:7px 10px;color:var(--t1);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.form-group{margin-bottom:13px}
.form-lbl{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}

/* Tab switch */
.tab-sw{display:flex;border:0.5px solid var(--bd2);border-radius:var(--r);overflow:hidden;width:fit-content;margin-bottom:18px}
.tab-sw button{padding:5px 16px;font-size:13px;border:none;background:none;color:var(--t2);cursor:pointer;font-family:inherit}
.tab-sw button.on{background:var(--bg);color:var(--t1);font-weight:500}

/* OCR zone */
.ocr-zone{border:0.5px dashed var(--bd2);border-radius:var(--rl);padding:20px 18px;text-align:left;background:var(--sur)}
.ocr-icon{font-size:32px;opacity:.2;line-height:1;margin-bottom:11px}
.code-block{display:inline-block;font-family:Menlo,Consolas,monospace;font-size:12px;background:var(--bg);padding:5px 12px;border-radius:var(--r);border:0.5px solid var(--bd);color:var(--t1);margin-top:7px}
.ocr-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ocr-head .ocr-icon{margin:0;flex-shrink:0}
.ocr-title{font-size:14px;font-weight:600;color:var(--t1)}
.ocr-sub{font-size:12px;color:var(--t3)}
.ocr-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ocr-file,.ocr-paste{display:flex;align-items:center;justify-content:center;min-height:82px;padding:12px;border:0.5px dashed var(--bd2);border-radius:var(--r);background:var(--bg);cursor:pointer;color:var(--t2);font-size:12px;text-align:center;line-height:1.5}
.ocr-file input{display:none}
.ocr-paste:focus{border-color:var(--amber);outline:none;background:var(--amb-s);color:var(--amber)}
.ocr-preview{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg)}
.ocr-preview img{width:74px;height:52px;object-fit:cover;border-radius:6px;border:0.5px solid var(--bd2);background:#fff;flex-shrink:0}
.ocr-preview-name{font-size:12px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocr-preview-meta{font-size:11px;color:var(--t3)}
.ocr-msg{font-size:12px;margin-top:10px;color:var(--t2);line-height:1.6}
.ocr-msg.err{color:var(--red)}
.ocr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px}

/* Progress dots */
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block}

/* Question list item */
.q-item{background:var(--sur);border:0.5px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:7px;transition:border-color .12s}
.q-item:hover{border-color:var(--bd2)}
.q-header{padding:11px 13px;cursor:pointer}
.q-preview{font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.q-tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.q-tag{font-size:10px;color:var(--t3)}
.q-detail{padding:11px 13px;border-top:0.5px solid var(--bd)}
.q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.q-source{font-size:11px;color:var(--t3)}

/* Bar chart (pure CSS) */
.chart-section{margin-bottom:22px}
.chart-title{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:11px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-name{width:64px;font-size:12px;color:var(--t2);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:14px;background:var(--sur2);border-radius:3px;overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-val{width:28px;font-size:11px;color:var(--t3);text-align:right;flex-shrink:0}

/* Charts grid */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}

/* Stat grid (3 col) */
.stats-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}

/* Empty & loading */
.empty{text-align:center;padding:56px 0;color:var(--t2);font-size:13px}
.empty-icon{font-size:36px;opacity:.2;margin-bottom:12px}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--t3);font-size:13px}

/* Divider */
.sep{height:0.5px;background:var(--bd);margin:1px 0 10px}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="logo">错题本</span>
    <span class="sub">行测备考 · cuoti v3.0</span>
  </div>
  <div id="layout">
    <nav id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const MODULES   = ["言语理解","数量关系","判断推理","常识判断","资料分析"];
const ERR_TYPES = ["粗心大意","知识盲区","思路错误","时间不够"];
const INTERVALS = [1,2,4,7,15,30,60];

const MOD = {
  "言语理解":{bg:"#E3EFFC",color:"#0B4280",chart:"#3B8ADD"},
  "数量关系":{bg:"#FAEAEA",color:"#8A1A1A",chart:"#D84040"},
  "判断推理":{bg:"#DCF2EC",color:"#07503F",chart:"#1A9E72"},
  "常识判断":{bg:"#EBF5DA",color:"#2A5C0A",chart:"#5A9920"},
  "资料分析":{bg:"#FBF0DC",color:"#7A4A00",chart:"#B8720F"},
};
const ERR = {
  "粗心大意":{bg:"#FBF0DC",color:"#7A4A00",chart:"#E8A020"},
  "知识盲区":{bg:"#FAEAEA",color:"#8A1A1A",chart:"#D84040"},
  "思路错误":{bg:"#DCF2EC",color:"#07503F",chart:"#1A9E72"},
  "时间不够":{bg:"#EBF5DA",color:"#2A5C0A",chart:"#5A9920"},
};
const RATING_CFG = [
  {label:"完全掌握",hint:"间隔×1.5",color:"#2A5C0A"},
  {label:"基本掌握",hint:"正常推进",color:"#0B4280"},
  {label:"模糊记得",hint:"间隔减半",color:"#B8720F"},
  {label:"完全不会",hint:"重置重来",color:"#B83030"},
];

// ── State ───────────────────────────────────────────────────────────────────
const S = {
  tab: "today",
  questions: [],
  stats: null,
  loading: true,
  // today page
  reviewPhase: {},   // id -> "question"|"answer"|"done"
  reviewResult: {},  // id -> {label, next}
  // list page
  expanded: null,
  filterMod: "",
  filterErr: "",
  search: "",
  // add page
  addMode: "manual",
  addSaved: false,
  addBusy: false,
  ocrBusy: false,
  ocrProvider: "auto",
  ocrKey: "",
  ocrFile: null,
  ocrFileName: "",
  ocrFileSource: "",
  ocrPreviewUrl: "",
  ocrError: "",
  ocrMessage: "",
  form: {module:"",error_type:"",content:"",wrong_ans:"",right_ans:"",analysis:"",source:"",tags:""},
};

// ── API bridge ───────────────────────────────────────────────────────────────
const BASE = location.protocol.startsWith("http") ? location.origin : "http://localhost:7417";

async function apiCall(pyMethod, pyArgs, httpFn) {
  if (window.pywebview && window.pywebview.api) {
    return window.pywebview.api[pyMethod](...(Array.isArray(pyArgs) ? pyArgs : [pyArgs]));
  }
  return httpFn();
}

const API = {
  async getQuestions(filters={}) {
    return apiCall("get_questions", [filters], async () => {
      const p = new URLSearchParams();
      Object.entries(filters).forEach(([k,v]) => { if(v) p.set(k, v); });
      const r = await fetch(`${BASE}/api/questions?${p}`);
      return r.json();
    });
  },
  async addQuestion(data) {
    return apiCall("add_question", [data], async () => {
      const r = await fetch(`${BASE}/api/questions`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      return r.json();
    });
  },
  async reviewQuestion(id, rating) {
    return apiCall("review_question", [id, rating], async () => {
      const r = await fetch(`${BASE}/api/questions/${id}/review`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating})});
      return r.json();
    });
  },
  async deleteQuestion(id) {
    return apiCall("delete_question", [id], async () => {
      await fetch(`${BASE}/api/questions/${id}`, {method:"DELETE"});
      return true;
    });
  },
  async getStats() {
    return apiCall("get_stats", [], async () => {
      const r = await fetch(`${BASE}/api/stats`);
      return r.json();
    });
  },
  async recognizeImage(data) {
    return apiCall("recognize_image", [data], async () => {
      const r = await fetch(`${BASE}/api/ocr`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      return r.json();
    });
  },
};

// ── Date helpers ─────────────────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().slice(0,10);
const daysUntil = s => {
  if (!s) return 9999;
  return Math.round((new Date(s) - new Date(todayStr())) / 86400000);
};
const daysLater = n => {
  const d = new Date(); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
};

// ── HTML helpers ─────────────────────────────────────────────────────────────
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function setOcrFile(file, source) {
  if (!file) return;
  if (S.ocrPreviewUrl) URL.revokeObjectURL(S.ocrPreviewUrl);
  S.ocrFile = file;
  S.ocrFileName = file.name || "clipboard.png";
  S.ocrFileSource = source || "图片";
  S.ocrPreviewUrl = URL.createObjectURL(file);
  S.ocrError = "";
  S.ocrMessage = "";
}

function clipboardImageFile(event) {
  const data = event.clipboardData;
  if (!data) return null;
  const items = Array.from(data.items || []);
  for (const item of items) {
    if (item.kind === "file" && item.type && item.type.startsWith("image/")) {
      const blob = item.getAsFile();
      if (!blob) continue;
      const ext = (item.type.split("/")[1] || "png").replace("jpeg", "jpg");
      return new File([blob], `clipboard-${Date.now()}.${ext}`, {type: item.type});
    }
  }
  const files = Array.from(data.files || []);
  return files.find(f => f.type && f.type.startsWith("image/")) || null;
}

function tagHTML(label, cfg, small) {
  const p = small ? "1px 7px" : "2px 9px";
  const f = small ? "10px" : "11px";
  return `<span class="tag" style="background:${cfg.bg};color:${cfg.color};padding:${p};font-size:${f}">${esc(label)}</span>`;
}

function reviewBadge(q) {
  const d = daysUntil(q.next_review);
  if (!q.next_review && q.reviewed) return `<span style="font-size:11px;color:var(--green);font-weight:500">已记熟</span>`;
  if (d < 0)  return `<span style="font-size:11px;color:var(--red);font-weight:500">逾期${-d}天</span>`;
  if (d === 0) return `<span style="font-size:11px;color:var(--amber);font-weight:500">今日复习</span>`;
  return `<span style="font-size:11px;color:var(--t3)">${d}天后</span>`;
}

function dotsHTML(count) {
  return `<span class="dots">${INTERVALS.map((_,i) =>
    `<span class="dot" style="background:${i<count?"var(--amb-t)":"var(--bd2)"}"></span>`
  ).join("")}</span>`;
}

function barChartHTML(data, colorMap) {
  if (!data || !data.length) return `<div style="color:var(--t3);font-size:12px">暂无数据</div>`;
  const max = Math.max(...data.map(d => d.value), 1);
  return `<div class="bar-chart">` + data.map(d => {
    const w = Math.round(d.value / max * 100);
    const c = colorMap[d.name] || "#999";
    return `<div class="bar-row">
      <div class="bar-name" title="${esc(d.name)}">${esc(d.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${c}"></div></div>
      <div class="bar-val">${d.value}</div>
    </div>`;
  }).join("") + `</div>`;
}

// ── Sidebar render ────────────────────────────────────────────────────────────
function renderSidebar() {
  const due = S.questions.filter(q => q.next_review && daysUntil(q.next_review) <= 0).length;
  const nav = [
    {id:"today", icon:"☐", label:"今日任务", badge: due},
    {id:"list",  icon:"≡", label:"错题库"},
    {id:"add",   icon:"+", label:"添加错题"},
    {id:"stats", icon:"↗", label:"数据统计"},
  ];
  const items = nav.map(n => `
    <button class="nav-btn${S.tab===n.id?" active":""}" data-nav="${n.id}">
      <span class="nav-icon">${n.icon}</span>${esc(n.label)}
      ${n.badge ? `<span class="nav-badge">${n.badge}</span>` : ""}
    </button>`).join("");

  return items + `
    <div class="sidebar-space"></div>
    <div class="sep"></div>
    <button class="nav-btn" data-nav-refresh>
      <span class="nav-icon">↺</span>刷新数据
    </button>
    <div class="sidebar-ver">cuoti v3.0</div>`;
}

// ── Today page ────────────────────────────────────────────────────────────────
function renderToday() {
  if (S.loading) return `<div class="loading">加载中...</div>`;
  const st    = S.stats || {};
  const due   = S.questions.filter(q => q.next_review && daysUntil(q.next_review) <= 0);
  const overdue = due.filter(q => daysUntil(q.next_review) < 0);

  const metrics = `<div class="metrics">
    ${[
      {l:"总错题",   v: st.total    ?? 0},
      {l:"今日复习", v: st.due      ?? 0, accent: (st.due>0)},
      {l:"已记熟",   v: st.memorized?? 0},
      {l:"本周新增", v: st.recent   ?? 0},
    ].map(m => `<div class="metric">
      <div class="metric-lbl">${m.l}</div>
      <div class="metric-val" style="color:${m.accent?"var(--red)":"var(--t1)"}">${m.v}</div>
    </div>`).join("")}
  </div>`;

  const warnHTML = overdue.length
    ? `<div class="alert alert-warn">${overdue.length} 道题已逾期，请优先复习</div>` : "";

  let cardsHTML = "";
  if (due.length === 0) {
    cardsHTML = `<div class="empty"><div class="empty-icon">✓</div>今日任务全部完成，继续加油！</div>`;
  } else {
    cardsHTML = due.map(q => renderReviewCard(q)).join("");
  }

  return metrics + warnHTML + cardsHTML;
}

function renderReviewCard(q) {
  const phase = S.reviewPhase[q.id] || "question";
  const modCfg = MOD[q.module] || {bg:"#eee",color:"#333"};
  const errCfg = ERR[q.error_type] || {bg:"#eee",color:"#333"};

  const header = `<div class="card-body">
    <div class="q-meta">
      ${tagHTML(q.module, modCfg, true)}
      ${tagHTML(q.error_type, errCfg, true)}
      <span style="margin-left:auto;font-size:10px;color:var(--t3)">第${(q.review_count||0)+1}轮</span>
    </div>
    <div class="q-content">${esc(q.content)}</div>
  </div>`;

  let footer = "";
  if (phase === "question") {
    footer = `<div class="card-footer">
      <button class="btn btn-answer" data-review-show="${q.id}">查看答案</button>
    </div>`;
  } else if (phase === "answer") {
    const ansBar = (q.wrong_ans || q.right_ans) ? `<div class="ans-bar">
      ${q.wrong_ans ? `<span class="ans-wrong">✗ 你选了：${esc(q.wrong_ans)}</span>` : ""}
      ${q.right_ans ? `<span class="ans-right">✓ 正确：${esc(q.right_ans)}</span>` : ""}
    </div>` : "";
    const analysis = q.analysis ? `<div class="q-analysis">${esc(q.analysis)}</div>` : "";
    const ratingBtns = RATING_CFG.map(r =>
      `<button class="rating-btn" data-review-rate="${q.id}" data-rating="${esc(r.label)}"
        style="border-color:${r.color};color:${r.color}">
        ${esc(r.label)} <span style="opacity:.55;font-size:10px;margin-left:3px">${r.hint}</span>
      </button>`).join("");
    footer = `<div class="card-body" style="border-top:0.5px solid var(--bd);padding-top:11px">
      ${ansBar}${analysis}
      <p style="font-size:12px;color:var(--t2);margin-bottom:7px;margin-top:${q.analysis?8:0}px">掌握程度？</p>
      <div class="ratings">${ratingBtns}</div>
    </div>`;
  } else if (phase === "done") {
    const res = S.reviewResult[q.id] || {};
    footer = `<div class="card-footer" style="justify-content:flex-start">
      <div class="review-done">
        <span class="done-check">✓</span>
        <span style="color:var(--green);font-weight:500">${esc(res.label||"")}</span>
        ${res.next
          ? `<span style="color:var(--t2)">下次复习：${res.next}</span>`
          : `<span style="color:var(--green)">全轮完成，长期记忆！</span>`}
      </div>
    </div>`;
  }

  return `<div class="card">${header}${footer}</div>`;
}

// ── List page ─────────────────────────────────────────────────────────────────
function renderList() {
  if (S.loading) return `<div class="loading">加载中...</div>`;

  const filtered = S.questions.filter(q => {
    if (S.filterMod && q.module !== S.filterMod) return false;
    if (S.filterErr && q.error_type !== S.filterErr) return false;
    if (S.search) {
      const s = S.search.toLowerCase();
      if (!q.content.toLowerCase().includes(s) &&
          !(q.tags||"").toLowerCase().includes(s) &&
          !(q.source||"").toLowerCase().includes(s)) return false;
    }
    return true;
  });

  const chipRow = (items, active, cfg, dataAttr) =>
    items.map(m => {
      const on = active === m;
      const c  = cfg[m];
      const st = on && c ? `background:${c.bg};color:${c.color};border-color:${c.color};` : "";
      return `<button class="chip${on?" on":""}" style="${st}" data-${dataAttr}="${esc(m)}">${esc(m)}</button>`;
    }).join("");

  const modChips = `<div class="filter-row">
    <button class="chip${!S.filterMod?" on":""}" data-filter-mod="">全部科目</button>
    ${chipRow(MODULES, S.filterMod, MOD, "filter-mod")}
  </div>`;
  const errChips = `<div class="filter-row">
    <button class="chip${!S.filterErr?" on":""}" data-filter-err="">全部原因</button>
    ${chipRow(ERR_TYPES, S.filterErr, ERR, "filter-err")}
  </div>`;

  const searchRow = `<div class="search-row">
    <input id="search-input" placeholder="搜索题目内容、标签、来源..." value="${esc(S.search)}">
    <span class="search-count">${filtered.length}/${S.questions.length} 题</span>
  </div>`;

  let items = "";
  if (filtered.length === 0) {
    items = `<div class="empty"><div class="empty-icon">○</div>没有符合条件的错题</div>`;
  } else {
    items = filtered.map(q => {
      const isOpen = S.expanded === q.id;
      const modCfg = MOD[q.module]||{bg:"#eee",color:"#333"};
      const errCfg = ERR[q.error_type]||{bg:"#eee",color:"#333"};
      const tagsHTML = (q.tags||"").split(",").filter(Boolean)
        .map(t => `<span class="q-tag">#${esc(t.trim())}</span>`).join("");

      let detail = "";
      if (isOpen) {
        const ansHTML = (q.wrong_ans||q.right_ans) ? `<div class="ans-bar" style="margin-bottom:8px">
          ${q.wrong_ans?`<span class="ans-wrong">✗ 我的答案：${esc(q.wrong_ans)}</span>`:""}
          ${q.right_ans?`<span class="ans-right">✓ 正确答案：${esc(q.right_ans)}</span>`:""}
        </div>` : "";
        const anHTML = q.analysis ? `<div class="q-analysis">${esc(q.analysis)}</div>` : "";
        detail = `<div class="q-detail">
          <div class="q-content" style="margin-bottom:9px">${esc(q.content)}</div>
          ${ansHTML}${anHTML}
          <div class="q-footer">
            <span class="q-source">${esc(q.source||"")}</span>
            <button class="btn btn-danger" data-delete="${q.id}">删除</button>
          </div>
        </div>`;
      }

      return `<div class="q-item">
        <div class="q-header" data-expand="${q.id}">
          <div class="q-meta">
            ${tagHTML(q.module, modCfg, true)}
            ${tagHTML(q.error_type, errCfg, true)}
            <span style="margin-left:auto;display:inline-flex;align-items:center;gap:9px">
              ${reviewBadge(q)}
              ${dotsHTML(q.review_count||0)}
            </span>
          </div>
          <div class="q-preview">${esc(q.content.split("\n")[0])}</div>
          ${tagsHTML ? `<div class="q-tags">${tagsHTML}</div>` : ""}
        </div>
        ${detail}
      </div>`;
    }).join("");
  }

  return searchRow + modChips + errChips + items;
}

// ── Add page ──────────────────────────────────────────────────────────────────
function renderAdd() {
  const f = S.form;
  const savedAlert = S.addSaved
    ? `<div class="alert alert-ok">✓ 已保存，明日开始第一轮复习</div>` : "";
  const ocrAlert = S.ocrMessage
    ? `<div class="alert alert-ok">${esc(S.ocrMessage)}</div>` : "";

  const manual = `
    ${savedAlert}
    ${ocrAlert}
    <div class="form-grid">
      <div>
        <label class="form-lbl">科目模块 *</label>
        <select id="f-module">
          <option value="">请选择...</option>
          ${MODULES.map(m=>`<option value="${esc(m)}"${f.module===m?" selected":""}>${esc(m)}</option>`).join("")}

      </div>
      <div>
        <label class="form-lbl">错误原因 *</label>
        <select id="f-error_type">
          <option value="">请选择...</option>
          ${ERR_TYPES.map(e=>`<option value="${esc(e)}"${f.error_type===e?" selected":""}>${esc(e)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-lbl">题目内容 *</label>
      <textarea id="f-content" rows="4" placeholder="粘贴题目全文，包括选项...">${esc(f.content)}</textarea>
    </div>
    <div class="form-grid">
      <div>
        <label class="form-lbl">我的答案</label>
        <input id="f-wrong_ans" placeholder="如 A" value="${esc(f.wrong_ans)}">
      </div>
      <div>
        <label class="form-lbl">正确答案</label>
        <input id="f-right_ans" placeholder="如 C" value="${esc(f.right_ans)}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-lbl">解析笔记</label>
      <textarea id="f-analysis" rows="2" placeholder="为什么错？关键点是什么？">${esc(f.analysis)}</textarea>
    </div>
    <div class="form-grid">
      <div>
        <label class="form-lbl">题目来源</label>
        <input id="f-source" placeholder="2023国考行测第12题" value="${esc(f.source)}">
      </div>
      <div>
        <label class="form-lbl">知识点标签</label>
        <input id="f-tags" placeholder="主旨题,转折关系" value="${esc(f.tags)}">
      </div>
    </div>
    <button class="btn btn-primary" id="btn-save" ${S.addBusy||!f.module||!f.error_type||!f.content.trim()?"disabled":""}>
      ${S.addBusy?"保存中...":"保存错题"}
    </button>`;

  const providerLabel = {
    auto: "自动选择",
    anthropic: "Claude 视觉",
    deepseek: "本地 OCR + DeepSeek",
  }[S.ocrProvider] || "自动选择";
  const fileSize = S.ocrFile ? `${Math.max(1, Math.round(S.ocrFile.size/1024))} KB` : "";
  const preview = S.ocrFile ? `<div class="ocr-preview">
    ${S.ocrPreviewUrl ? `<img src="${esc(S.ocrPreviewUrl)}" alt="">` : ""}
    <div style="min-width:0">
      <div class="ocr-preview-name">${esc(S.ocrFileName || "待识别图片")}</div>
      <div class="ocr-preview-meta">${esc(S.ocrFileSource || "图片")} ${fileSize ? "· "+esc(fileSize) : ""}</div>
    </div>
  </div>` : "";
  const ocr = `<div class="ocr-zone">
    <div class="ocr-head">
      <div class="ocr-icon">◫</div>
      <div>
        <div class="ocr-title">截图识别</div>
        <div class="ocr-sub">识别后会自动填入表单，请核对后保存</div>
      </div>
    </div>
    <div class="ocr-inputs">
      <label class="ocr-file">
        <input id="ocr-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        选择图片文件
      </label>
      <div class="ocr-paste" id="ocr-paste-zone" tabindex="0">粘贴剪贴板图片</div>
    </div>
    ${preview}
    <div class="form-grid">
      <div>
        <label class="form-lbl">识别模式</label>
        <select id="ocr-provider">
          ${[
            ["auto","自动选择"],
            ["anthropic","Claude 视觉"],
            ["deepseek","本地 OCR + DeepSeek"],
          ].map(([v,l])=>`<option value="${v}"${S.ocrProvider===v?" selected":""}>${l}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="form-lbl">临时 API Key</label>
        <input id="ocr-key" type="password" placeholder="可留空，优先读取环境变量" value="${esc(S.ocrKey)}">
      </div>
    </div>
    <div class="ocr-actions">
      <button class="btn btn-primary" id="btn-ocr-recognize" ${S.ocrBusy||!S.ocrFile?"disabled":""}>
        ${S.ocrBusy ? "识别中..." : "识别并填入表单"}
      </button>
      <span style="font-size:12px;color:var(--t3)">${esc(providerLabel)}</span>
    </div>
    ${S.ocrError ? `<div class="ocr-msg err">${esc(S.ocrError)}</div>` :
      `<div class="ocr-msg">自动模式会优先使用 ANTHROPIC_API_KEY，其次 DEEPSEEK_API_KEY。DeepSeek 模式需要本地 OCR，推荐安装 rapidocr-onnxruntime。</div>`}

  return `<div class="tab-sw">
    <button class="tab-btn${S.addMode==="manual"?" on":""}" data-add-mode="manual">手动输入</button>
    <button class="tab-btn${S.addMode==="ocr"?" on":""}" data-add-mode="ocr">截图 OCR 导入</button>
  </div>
  <div style="max-width:520px">${S.addMode==="ocr" ? ocr : manual}</div>`;
}

// ── Stats page ────────────────────────────────────────────────────────────────
function renderStats() {
  if (S.loading) return `<div class="loading">加载中...</div>`;
  const st = S.stats;
  if (!st) return `<div class="empty"><div class="empty-icon">○</div>暂无数据，先添加一些错题吧</div>`;

  const modColorMap  = Object.fromEntries(MODULES.map(m  => [m,  (MOD[m] ||{chart:"#999"}).chart]));
  const errColorMap  = Object.fromEntries(ERR_TYPES.map(e=> [e,  (ERR[e] ||{chart:"#999"}).chart]));
  const distColorMap = Object.fromEntries((st.review_dist||[]).map(d => [d.name, "var(--amb-t)"]));

  return `
  <div class="stats-metrics">
    ${[
      {l:"总错题",   v:st.total??0},
      {l:"已记熟",   v:st.memorized??0},
      {l:"今日待复", v:st.due??0,     accent:(st.due>0)},
      {l:"已逾期",   v:st.overdue??0, accent:(st.overdue>0)},
      {l:"本周新增", v:st.recent??0},
      {l:"累计复习", v:st.reviews??0},
    ].map(m=>`<div class="metric">
      <div class="metric-lbl">${m.l}</div>
      <div class="metric-val" style="font-size:22px;color:${m.accent?"var(--red)":"var(--t1)"}">${m.v}</div>
    </div>`).join("")}
  </div>

  <div class="charts-grid">
    <div class="chart-section">
      <div class="chart-title">按科目分布</div>
      ${barChartHTML(st.by_module||[], modColorMap)}
    </div>
    <div class="chart-section">
      <div class="chart-title">按错误原因</div>
      ${barChartHTML(st.by_error||[], errColorMap)}
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-title">复习轮次分布</div>
    ${barChartHTML(st.review_dist||[], distColorMap)}
    <p style="font-size:11px;color:var(--t3);margin-top:9px">
      间隔计划：1→2→4→7→15→30→60天 · 第7轮后进入长期记忆
    </p>
  </div>`;
}

// ── Render engine ────────────────────────────────────────────────────────────
function renderSidebarEl() {
  document.getElementById("sidebar").innerHTML = renderSidebar();
}

function renderMainEl() {
  const pages = {today:renderToday, list:renderList, add:renderAdd, stats:renderStats};
  const titleMap = {today:"今日任务",list:"错题库",add:"添加错题",stats:"数据统计"};
  document.getElementById("main").innerHTML =
    `<h2 class="page-title">${titleMap[S.tab]||""}</h2>` + (pages[S.tab]||renderToday)();
  attachFocus();
}

function render() {
  renderSidebarEl();
  renderMainEl();
}

// Re-focus search input on list page to preserve typing position
function attachFocus() {
  if (S.tab === "list") {
    const inp = document.getElementById("search-input");
    if (inp) {
      inp.addEventListener("input", e => {
        S.search = e.target.value;
        // Debounced re-render preserving cursor
        clearTimeout(inp._t);
        inp._t = setTimeout(() => renderMainEl(), 160);
      });
    }
  }
  // Sync form fields
  if (S.tab === "add" && S.addMode === "manual") {
    ["module","error_type","content","wrong_ans","right_ans","analysis","source","tags"].forEach(k => {
      const el = document.getElementById("f-"+k);
      if (el) el.addEventListener("input", e => { S.form[k] = e.target.value; });
      if (el && el.tagName === "SELECT") el.addEventListener("change", e => { S.form[k] = e.target.value; });
    });
  }
  if (S.tab === "add" && S.addMode === "ocr") {
    const provider = document.getElementById("ocr-provider");
    if (provider) provider.addEventListener("change", e => {
      S.ocrProvider = e.target.value;
      S.ocrError = "";
      renderMainEl();
    });
    const key = document.getElementById("ocr-key");
    if (key) key.addEventListener("input", e => { S.ocrKey = e.target.value; });
    const file = document.getElementById("ocr-file");
    if (file) file.addEventListener("change", e => {
      const picked = e.target.files && e.target.files[0];
      if (picked) setOcrFile(picked, "本地文件");
      renderMainEl();
    });
    const pasteZone = document.getElementById("ocr-paste-zone");
    if (pasteZone) pasteZone.addEventListener("click", () => pasteZone.focus());
  }
}

// ── Event delegation ──────────────────────────────────────────────────────────
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-nav]");
  if (t) { S.tab = t.dataset.nav; render(); return; }

  if (e.target.closest("[data-nav-refresh]")) {
    await loadAll(); return;
  }

  // Filter chips
  const fm = e.target.closest("[data-filter-mod]");
  if (fm) {
    S.filterMod = S.filterMod === fm.dataset.filterMod ? "" : fm.dataset.filterMod;
    renderMainEl(); return;
  }
  const fe = e.target.closest("[data-filter-err]");
  if (fe) {
    S.filterErr = S.filterErr === fe.dataset.filterErr ? "" : fe.dataset.filterErr;
    renderMainEl(); return;
  }

  // Add mode tabs
  const am = e.target.closest("[data-add-mode]");
  if (am) { S.addMode = am.dataset.addMode; renderMainEl(); return; }

  // Save button
  if (e.target.id === "btn-save" || e.target.closest("#btn-save")) {
    await handleSave(); return;
  }

  // OCR recognize button
  if (e.target.id === "btn-ocr-recognize" || e.target.closest("#btn-ocr-recognize")) {
    await handleOcrRecognize(); return;
  }

  // Expand question
  const exp = e.target.closest("[data-expand]");
  if (exp) {
    const id = +exp.dataset.expand;
    S.expanded = S.expanded === id ? null : id;
    renderMainEl(); return;
  }

  // Delete
  const del = e.target.closest("[data-delete]");
  if (del) {
    const id = +del.dataset.delete;
    if (confirm("确认删除这道错题？")) {
      await API.deleteQuestion(id);
      S.questions = S.questions.filter(q => q.id !== id);
      S.expanded  = null;
      await refreshStats();
      renderMainEl();
    }
    return;
  }

  // Review: show answer
  const show = e.target.closest("[data-review-show]");
  if (show) {
    S.reviewPhase[+show.dataset.reviewShow] = "answer";
    renderMainEl(); return;
  }

  // Review: rate
  const rate = e.target.closest("[data-review-rate]");
  if (rate) {
    const id     = +rate.dataset.reviewRate;
    const rating = rate.dataset.rating;
    const updated = await API.reviewQuestion(id, rating);
    S.questions = S.questions.map(q => q.id===id ? updated : q);
    S.reviewPhase[id]  = "done";
    S.reviewResult[id] = {label: rating, next: updated?.next_review || null};
    await refreshStats();
    renderMainEl(); return;
  }
});

document.addEventListener("paste", e => {
  if (S.tab !== "add" || S.addMode !== "ocr" || S.ocrBusy) return;
  const file = clipboardImageFile(e);
  if (!file) return;
  e.preventDefault();
  setOcrFile(file, "剪贴板图片");
  renderMainEl();
});

// ── Save handler ──────────────────────────────────────────────────────────────
async function handleSave() {
  const f = S.form;
  if (!f.module || !f.error_type || !f.content.trim() || S.addBusy) return;
  // Read current form values before re-render
  ["module","error_type","content","wrong_ans","right_ans","analysis","source","tags"].forEach(k => {
    const el = document.getElementById("f-"+k);
    if (el) S.form[k] = el.value;
  });
  S.addBusy = true;
  renderMainEl();
  try {
    const newQ = await API.addQuestion({...S.form});
    S.questions.unshift(newQ);
    S.form = {module:"",error_type:"",content:"",wrong_ans:"",right_ans:"",analysis:"",source:"",tags:""};
    S.addSaved = true;
    await refreshStats();
    renderMainEl();
    setTimeout(() => { S.addSaved = false; renderMainEl(); }, 2500);
  } catch (err) {
    console.error(err);
  }
  S.addBusy = false;
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("读取图片失败，请重新选择截图"));
    reader.readAsDataURL(file);
  });
}

async function handleOcrRecognize() {
  if (!S.ocrFile || S.ocrBusy) return;
  S.ocrBusy = true;
  S.ocrError = "";
  S.ocrMessage = "";
  renderMainEl();

  try {
    const imageData = await readFileAsDataURL(S.ocrFile);
    const res = await API.recognizeImage({
      provider: S.ocrProvider,
      api_key: S.ocrKey,
      image_name: S.ocrFile.name,
      image_data: imageData,
    });
    if (!res || !res.ok) {
      throw new Error((res && res.error) || "识别失败，请重试");
    }

    const data = res.data || {};
    const module = MODULES.includes(data.module) ? data.module : "";
    S.form = {
      module,
      error_type: S.form.error_type || "",
      content: data.content || "",
      wrong_ans: (data.wrong_ans || "").toUpperCase(),
      right_ans: (data.right_ans || "").toUpperCase(),
      analysis: data.analysis || "",
      source: data.source || "",
      tags: data.tags || "",
    };
    S.ocrFile = null;
    S.ocrFileName = "";
    S.ocrFileSource = "";
    if (S.ocrPreviewUrl) URL.revokeObjectURL(S.ocrPreviewUrl);
    S.ocrPreviewUrl = "";
    S.ocrMessage = `已完成截图识别（${res.provider || S.ocrProvider}），请核对内容并选择错误原因后保存`;
    S.addMode = "manual";
  } catch (err) {
    S.ocrError = err.message || String(err);
  }

  S.ocrBusy = false;
  renderMainEl();
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function refreshStats() {
  S.stats = await API.getStats();
}

async function loadAll() {
  S.loading = true;
  render();
  try {
    const [qs, st] = await Promise.all([API.getQuestions(), API.getStats()]);
    S.questions = qs || [];
    S.stats     = st || null;
  } catch (e) {
    console.error("Load failed:", e);
  }
  S.loading = false;
  render();
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  render(); // Show loading state immediately
  if (window.pywebview && window.pywebview.api) {
    loadAll();
  } else {
    window.addEventListener("pywebviewready", loadAll);
    // Browser / HTTP mode fallback
    setTimeout(() => {
      if (!window._loaded) loadAll();
    }, 400);
  }
}

window._loaded = false;
async function loadAll_guarded() {
  window._loaded = true;
  await loadAll();
}

// Re-wire to guarded version
window.removeEventListener && window.removeEventListener("pywebviewready", loadAll);
if (window.pywebview && window.pywebview.api) {
  loadAll_guarded();
} else {
  window.addEventListener("pywebviewready", loadAll_guarded);
  setTimeout(() => { if (!window._loaded) loadAll_guarded(); }, 400);
}

render(); // Initial render (loading state)
</script>
